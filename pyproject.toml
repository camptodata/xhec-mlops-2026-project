[project]
name = "xhec-mlops-project-student"
version = "0.0.1"
authors = [
  { name = "Nick Hartmann", email = "nick.hartmann@hec.edu" },
]
description = "X-HEC MLOps Project on Abalone age prediction model"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=3.1.0",
    "pydantic>=2.14.1",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.2",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "seaborn>=0.13.2",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "ANN", "PTH"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["D", "ANN", "E402"]
"tests/*" = ["D", "ANN"]
